version: '3.8'

services:
  # ============================================
  # PostgreSQL Database (Production)
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: kindstyle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kindstyle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kindstyle_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kindstyle}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kindstyle-network

  # ============================================
  # Redis (Production)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: kindstyle-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kindstyle-network

  # ============================================
  # Next.js Web App (Production)
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: kindstyle-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kindstyle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kindstyle_prod}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@kindstyle.com}
      - FORTNITE_API_KEY=${FORTNITE_API_KEY:?FORTNITE_API_KEY is required}
      - FORTNITE_API_URL=https://fortnite-api.com
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      - NEXT_PUBLIC_WHATSAPP_NUMBER=${NEXT_PUBLIC_WHATSAPP_NUMBER}
      - MOCK_FORTNITE=false
      - MOCK_FULFILLMENT=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kindstyle-network

  # ============================================
  # Background Worker (Production)
  # ============================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        - NODE_ENV=production
    container_name: kindstyle-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kindstyle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kindstyle_prod}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - FORTNITE_API_KEY=${FORTNITE_API_KEY:?FORTNITE_API_KEY is required}
      - LEGACY_FORTNITE_API_KEY=${LEGACY_FORTNITE_API_KEY:-}
      - FORTNITE_API_URL=${FORTNITE_API_URL:-https://fortnite-api.com}
      - LEGACY_FORNITE_URL=${LEGACY_FORNITE_URL:-https://fortnite-api.com}
      - API_FORTNITE_API_KEY=${API_FORTNITE_API_KEY:-}
      - API_FORNITE_URL=${API_FORNITE_URL:-https://prod.api-fortnite.com/api}
      - CATALOG_PROVIDER=${CATALOG_PROVIDER:-legacy}
      - CATALOG_SHADOW=${CATALOG_SHADOW:-false}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@kindstyle.com}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      - CATALOG_SYNC_INTERVAL=${CATALOG_SYNC_INTERVAL:-3600000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kindstyle-network

networks:
  kindstyle-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
